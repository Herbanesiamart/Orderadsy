<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: #1F2937;
  }

  /* Wrap — bersih, tanpa background abu */
  .checkout-wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 0;
  }

  /* Trust bar */
  .trust-bar {
    display: flex;
    gap: 20px;
    padding: 14px 20px;
    border-bottom: 1px solid #E5E7EB;
  }
  .trust-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #6B7280;
  }

  /* Form section */
  .form-section { padding: 20px; }

  .data-label {
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 16px;
  }

  .co-group { margin-bottom: 10px; }

  .co-input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    font-size: 14px;
    color: #1F2937;
    background: #fff;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .co-input:focus { border-color: #F59E0B; }
  .co-input.error { border-color: #EF4444; }
  .co-input::placeholder { color: #D1D5DB; }

  textarea.co-input { resize: vertical; min-height: 80px; }

  .field-error { font-size: 11px; color: #EF4444; margin-top: 3px; display: none; }

  /* Submit */
  .submit-section { padding: 0 20px 20px; }

  .btn-submit {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: filter 0.15s;
    letter-spacing: 0.01em;
  }
  .btn-submit:hover   { filter: brightness(0.93); }
  .btn-submit:disabled { filter: brightness(0.6); cursor: not-allowed; }

  .btn-arrow {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .footer-co {
    text-align: center;
    font-size: 11px;
    color: #9CA3AF;
    padding: 12px 20px 24px;
  }

  /* Loading */
  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.9);
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #E5E7EB;
    border-top-color: #F59E0B;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="margin-top:12px;font-size:13px;color:var(--gray-500);">Memproses pesanan...</div>
</div>

<div class="checkout-wrap" id="checkoutWrap" style="display:none;">

  <!-- Trust bar -->
  <div class="trust-bar">
    <div class="trust-item">🔒 Transaksi Aman</div>
    <div class="trust-item">👍 Jaminan Kepuasan</div>
    <div class="trust-item">✅ Garansi Original</div>
  </div>

  <!-- Form -->
  <div class="form-section">
    <div class="data-label">Data Penerima:</div>
    <div id="formFields"></div>
  </div>

  <!-- Submit -->
  <div class="submit-section">
    <button class="btn-submit" id="btnSubmit" onclick="submitOrder()">
      <span id="btnText">Beli Sekarang</span>
      <span class="btn-arrow">→</span>
    </button>
  </div>

  <div class="footer-co">Pesanan Anda aman & terlindungi</div>

</div>

<!-- Error page -->
<div id="errorPage" style="display:none;text-align:center;padding:80px 20px;">
  <div style="font-size:48px;margin-bottom:16px;">😕</div>
  <div style="font-size:18px;font-weight:700;color:#1F2937;margin-bottom:8px;">Halaman tidak ditemukan</div>
  <div style="color:#9CA3AF;font-size:14px;">Link checkout tidak valid atau sudah tidak aktif.</div>
</div>

<script>
  const SUPABASE_URL     = 'https://bdoodcaxizksnhxunjky.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkb29kY2F4aXprc25oeHVuamt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTIxNzYsImV4cCI6MjEwMzkyODE3Nn0.5OX4tunpCbAbaMb7NtEDiuxpxtHw8LoCC4iN1A4Dkds';
  const API_URL          = 'https://orderadsy.vercel.app/api';

  const sbH = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  };

  async function sbGet(table, q = '') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${q}`, { headers: sbH });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  function formatRp(num) {
    return 'Rp' + (num || 0).toLocaleString('id-ID');
  }

  function normalizeWA(hp) {
    let n = (hp || '').replace(/\D/g, '');
    if (n.startsWith('0')) n = '62' + n.slice(1);
    if (n.startsWith('8')) n = '62' + n;
    if (!n.startsWith('62')) n = '62' + n;
    return n;
  }

  // ── Meta Pixel browser-side ──────────────────────────────
  function initPixel(pixelId) {
    if (!pixelId) return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', pixelId);
    fbq('track', 'ViewContent');
  }

  // ── Generate unique event ID for dedup ──────────────────
  function genEventId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ── Ambil fbc (klik iklan) & fbp (browser ID) untuk atribusi ──
  function getFbc() {
    // Coba dari URL fbclid dulu (fresh click dari iklan)
    const fbclid = new URLSearchParams(location.search).get('fbclid');
    if (fbclid) return `fb.1.${Date.now()}.${fbclid}`;
    // Fallback dari cookie _fbc
    const m = document.cookie.match(/_fbc=([^;]+)/);
    return m ? m[1] : null;
  }

  function getFbp() {
    const m = document.cookie.match(/_fbp=([^;]+)/);
    return m ? m[1] : null;
  }

  // ── Page state ──────────────────────────────────────────
  const params      = new URLSearchParams(location.search);
  const slug        = params.get('slug');
  const pageIdParam = params.get('page');

  let product   = null;
  let checkoutPage = null;
  let assignedCS = [];
  let rotatorIndex = 0;
  let fields = [];

  async function init() {
    if (!slug) { showError(); return; }

    try {
      // Step 1: load product dulu (butuh product.id untuk query berikutnya)
      const products = await sbGet('products', `?slug=eq.${slug}&status=eq.active&limit=1`);
      if (!products.length) { showError(); return; }
      product = products[0];

      // Step 2: load checkout page + CS list + rotator semua paralel
      const pageQuery = pageIdParam
        ? `?id=eq.${pageIdParam}&limit=1`
        : `?product_id=eq.${product.id}&order=created_at.asc&limit=1`;

      const [pages, csAssign, rotator] = await Promise.all([
        sbGet('checkout_pages', pageQuery),
        sbGet('product_cs', `?product_id=eq.${product.id}&select=cs_id,cs_team(id,name,wa_number,email)`),
        sbGet('cs_rotator', `?product_id=eq.${product.id}&limit=1`).catch(() => []),
      ]);

      if (!pages.length) { showError(); return; }
      checkoutPage  = pages[0];
      assignedCS    = csAssign.map(a => a.cs_team).filter(Boolean);
      rotatorIndex  = rotator[0]?.last_cs_index || 0;

      document.title = product.name + ' — Order';
      initPixel(product.pixel_id);
      renderPage();
      document.getElementById('checkoutWrap').style.display = '';

    } catch(e) {
      console.error(e);
      showError();
    }
  }

  function showError() {
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('errorPage').style.display = '';
  }

  function renderPage() {
    document.getElementById('loadingOverlay').style.display = 'none';

    // Fields
    fields = checkoutPage.fields_config || [];
    const enabledFields = fields.filter(f => f.enabled);
    document.getElementById('formFields').innerHTML = enabledFields.map(f => {
      const inputType = f.key === 'email' ? 'email' : f.key === 'wa' ? 'tel' : 'text';
      const isTextarea = f.key === 'keluhan' || f.key === 'catatan';
      const autocomplete = f.key==='nama'?'name':f.key==='wa'?'tel':f.key==='email'?'email':f.key==='alamat'?'street-address':'off';
      const placeholder = f.label + ' *';

      const waAttrs = f.key === 'wa'
        ? `inputmode="numeric" pattern="[0-9+\\-() ]*" oninput="this.value=this.value.replace(/[^0-9+()\\- ]/g,'')"`
        : '';
      const input = isTextarea
        ? `<textarea class="co-input" id="field-${f.key}" placeholder="${placeholder}" rows="3"></textarea>`
        : `<input type="${inputType}" class="co-input" id="field-${f.key}" placeholder="${placeholder}" autocomplete="${autocomplete}" ${waAttrs}>`;

      return `<div class="co-group">
        ${input}
        <div class="field-error" id="err-${f.key}">${f.label} wajib diisi</div>
      </div>`;
    }).join('');

    // Button
    const btnTextVal = checkoutPage.button_text || 'Beli Sekarang';
    const iconKey    = checkoutPage.button_icon || 'arrow';
    const iconMap = {
      arrow:    '<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.3);font-size:14px;">→</span>',
      whatsapp: '<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
      check:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      cart:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/></svg>',
      send:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
      bolt:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
      gift:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>',
      none:     '',
    };
    const iconHtml = iconMap[iconKey] || iconMap.arrow;
    const btnEl = document.getElementById('btnSubmit');
    btnEl.innerHTML = `<span>${btnTextVal}</span>${iconHtml ? `<span style="display:inline-flex;align-items:center;">${iconHtml}</span>` : ''}`;
    btnEl.style.background = checkoutPage.button_color || '#F59E0B';
  }

  function getFieldVal(key) {
    const el = document.getElementById('field-' + key);
    return el ? el.value.trim() : '';
  }

  function validateWA(raw) {
    const digits = raw.replace(/\D/g, '');
    // Harus angka semua, panjang 9–15 digit, dan mulai dari 08 / 628 / 62
    if (!digits) return false;
    if (digits.length < 9 || digits.length > 15) return false;
    return /^(08|628|62)/.test(digits);
  }

  function validateForm() {
    let valid = true;
    const enabledFields = fields.filter(f => f.enabled);
    enabledFields.forEach(f => {
      const val = getFieldVal(f.key);
      const errEl = document.getElementById('err-' + f.key);
      const inputEl = document.getElementById('field-' + f.key);

      let fieldValid = !!val;

      // Validasi khusus nomor WA
      if (f.key === 'wa' && val) {
        fieldValid = validateWA(val);
        if (errEl && !fieldValid) errEl.textContent = 'Nomor WhatsApp tidak valid (contoh: 08123456789)';
      } else if (errEl) {
        errEl.textContent = f.label + ' wajib diisi';
      }

      if (!fieldValid) {
        if (errEl) errEl.style.display = 'block';
        if (inputEl) inputEl.classList.add('error');
        valid = false;
      } else {
        if (errEl) errEl.style.display = 'none';
        if (inputEl) inputEl.classList.remove('error');
      }
    });
    return valid;
  }

  async function submitOrder() {
    if (!validateForm()) { return; }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;

    const eventId = genEventId();
    const customerName    = getFieldVal('nama');
    const customerWA      = getFieldVal('wa');
    const customerEmail   = getFieldVal('email');
    const customerAddress = getFieldVal('alamat');
    const customerCity    = getFieldVal('kota');
    const customerNote    = getFieldVal('catatan');
    const customerKeluhan = getFieldVal('keluhan');

    // Pick CS (round-robin)
    const cs = assignedCS.length > 0 ? assignedCS[rotatorIndex % assignedCS.length] : null;

    try {
      // Hitung midnight WIB untuk count query
      const WIB_OFFSET = 7 * 60 * 60 * 1000;
      const nowWIB = new Date(Date.now() + WIB_OFFSET);
      nowWIB.setUTCHours(0, 0, 0, 0);
      const todayStartUTC = new Date(nowWIB.getTime() - WIB_OFFSET).toISOString();

      // Save order + count hari ini paralel — hemat 1 round-trip
      const [orderRes, countRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/orders`, {
          method: 'POST',
          headers: { ...sbH, 'Prefer': 'return=representation' },
          body: JSON.stringify({
            checkout_page_id: checkoutPage.id,
            product_id:       product.id,
            cs_id:            cs?.id || null,
            customer_name:    customerName,
            customer_wa:      normalizeWA(customerWA),
            customer_email:   customerEmail || null,
            customer_address: customerAddress || null,
            customer_city:    customerCity || null,
            customer_note:    customerNote || null,
            customer_keluhan: customerKeluhan || null,
            status:           'pending',
          }),
        }),
        fetch(`${SUPABASE_URL}/rest/v1/orders?cs_id=eq.${cs?.id}&created_at=gte.${todayStartUTC}&select=id`, {
          headers: { ...sbH, 'Prefer': 'count=exact', 'Range': '0-0' },
        }).catch(() => null),
      ]);

      const orderData = await orderRes.json();
      const orderId = orderData[0]?.id;
      const cr = countRes?.headers?.get('Content-Range') || '';
      // +1 karena count jalan paralel bareng INSERT, belum tentu hitung orderan baru ini
      const orderNumberToday = (parseInt(cr.split('/')[1] || '0') || 0) + 1;

      // 2-5. Semua background tasks — fire and forget, tidak perlu ditunggu
      const capiEvent = checkoutPage.pixel_event || 'Lead';

      // Update rotator
      if (assignedCS.length > 1) {
        fetch(`${SUPABASE_URL}/rest/v1/cs_rotator?product_id=eq.${product.id}`, {
          method: 'PATCH',
          headers: { ...sbH, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ last_cs_index: (rotatorIndex + 1) % assignedCS.length }),
        }).catch(() => {});
      }

      // CAPI
      if (product.pixel_id && product.access_token) {
        fetch(`${API_URL}/send-capi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pixel_id:      product.pixel_id,
            access_token:  product.access_token,
            event_name:    capiEvent,
            event_id:      eventId,
            event_time:    Math.floor(Date.now() / 1000),
            user_data: {
              ph: normalizeWA(customerWA), em: customerEmail || null,
              fn: customerName?.split(' ')[0]?.toLowerCase() || null,
              ln: customerName?.split(' ').slice(1).join(' ')?.toLowerCase() || null,
              ct: customerCity?.toLowerCase().replace(/\s/g, '') || null,
              country: 'id',
              fbc: getFbc(),
              fbp: getFbp(),
            },
            custom_data: { product_name: product.name, order_id: orderId, value: product.price, currency: 'IDR' },
            event_source_url: window.location.href,
          }),
        }).catch(() => {});
      }

      // Browser pixel
      if (window.fbq && product.pixel_id) {
        fbq('track', capiEvent, { value: product.price, currency: 'IDR' }, { eventID: eventId });
      }

      // WA notif ke CS via Fonnte
      if (cs?.wa_number) {
        const welcomeTemplate = product.followup_welcome || 'Halo Kak {{name}}, saya {{cs_name}}. Terima kasih sudah order ya kak!\n\nNama     : {{name}}\nNo. WA   : {{phone}}\nAlamat   : {{address}}\n\nSudah benar ya kak? 😊';
        const waMessage = welcomeTemplate
          .replace(/\{\{name\}\}/gi,    customerName)
          .replace(/\{\{cs_name\}\}/gi, cs.name)
          .replace(/\{\{phone\}\}/gi,   normalizeWA(customerWA))
          .replace(/\{\{address\}\}/gi, [customerAddress, customerCity].filter(Boolean).join(', '))
          .replace(/\{\{product\}\}/gi, product.name);

        fetch(`${API_URL}/send-wa-notif`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cs_wa: cs.wa_number, cs_name: cs.name,
            customer_name: customerName, customer_wa: normalizeWA(customerWA),
            customer_address: customerAddress, customer_city: customerCity,
            customer_keluhan: customerKeluhan,
            product_name: product.name, order_id: orderId,
            wa_message: waMessage, order_number_today: orderNumberToday,
          }),
        }).catch(() => {});
      }

      // Email notif (backup)
      if (cs?.email) {
        const welcomeTemplate = product.followup_welcome || 'Halo Kak {{name}}, saya {{cs_name}}. Terima kasih sudah order ya kak!\n\nNama     : {{name}}\nNo. WA   : {{phone}}\nAlamat   : {{address}}\n\nSudah benar ya kak? 😊';
        const waMessage = welcomeTemplate
          .replace(/\{\{name\}\}/gi,    customerName)
          .replace(/\{\{cs_name\}\}/gi, cs.name)
          .replace(/\{\{phone\}\}/gi,   normalizeWA(customerWA))
          .replace(/\{\{address\}\}/gi, [customerAddress, customerCity].filter(Boolean).join(', '))
          .replace(/\{\{product\}\}/gi, product.name);

        fetch(`${API_URL}/send-order-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: cs.email, cs_name: cs.name,
            customer_name: customerName, customer_wa: normalizeWA(customerWA),
            customer_address: customerAddress, customer_city: customerCity,
            customer_keluhan: customerKeluhan,
            product_name: product.name, order_id: orderId,
            wa_message: waMessage, order_number_today: orderNumberToday,
          }),
        }).catch(() => {});
      }

      // 6. Redirect langsung ke WA CS tanpa delay
      if (cs) {
        const redirectTemplate = product.followup_redirect || 'Halo, saya {{name}} ingin order {{product}}\n\nNama     : {{name}}\nNo. WA   : {{phone}}\nAlamat   : {{address}}';
        const msg = redirectTemplate
          .replace(/\{\{name\}\}/gi,    customerName)
          .replace(/\{\{phone\}\}/gi,   normalizeWA(customerWA))
          .replace(/\{\{address\}\}/gi, [customerAddress, customerCity].filter(Boolean).join(', '))
          .replace(/\{\{product\}\}/gi, product.name);

        const waUrl = `https://wa.me/${normalizeWA(cs.wa_number)}?text=${encodeURIComponent(msg)}`;
        try {
          if (window.top !== window.self) {
            window.top.location.href = waUrl;
          } else {
            window.location.href = waUrl;
          }
        } catch(e) {
          window.open(waUrl, '_blank');
        }
      }

    } catch(e) {
      console.error(e);
      btn.disabled = false;
      alert('Terjadi kesalahan, coba lagi.');
    }
  }

  // Auto-resize iframe height
  function notifyParentHeight() {
    const h = document.body.scrollHeight;
    const id = (pageIdParam || '').slice(0, 8);
    try {
      window.parent.postMessage({ type: 'oa-resize', id, height: h }, '*');
    } catch(e) {}
  }
  // Observe height changes
  if (window.ResizeObserver) {
    new ResizeObserver(notifyParentHeight).observe(document.body);
  }

  // Show loading spinner initially
  document.getElementById('loadingOverlay').style.display = 'flex';
  init();
</script>
</body>
</html>

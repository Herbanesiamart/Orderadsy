<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Performance — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .perf-section { margin-bottom: 12px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--gray-200); }

  .perf-product-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; cursor: pointer; user-select: none;
    background: var(--white); transition: background .15s;
  }
  .perf-product-header:hover { background: var(--gray-50); }

  .perf-product-img {
    width: 40px; height: 40px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
    background: var(--gray-100);
  }
  .perf-product-img-placeholder {
    width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
    background: var(--primary-light); display: flex; align-items: center;
    justify-content: center; font-size: 18px;
  }
  .perf-product-info { flex: 1; min-width: 0; }
  .perf-product-name { font-weight: 700; font-size: 14px; color: var(--gray-800); }
  .perf-product-meta { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .perf-chevron {
    font-size: 12px; color: var(--gray-400); transition: transform .2s; flex-shrink: 0;
  }
  .perf-chevron.open { transform: rotate(90deg); }

  .perf-body { display: none; border-top: 1px solid var(--gray-200); }
  .perf-body.open { display: block; }

  .perf-table { width: 100%; border-collapse: collapse; }
  .perf-table th {
    padding: 10px 16px; font-size: 11px; font-weight: 600;
    color: var(--gray-400); text-transform: uppercase;
    border-bottom: 1px solid var(--gray-200); text-align: left;
    background: var(--gray-50);
  }
  .perf-table td {
    padding: 11px 16px; font-size: 13px;
    border-bottom: 1px solid var(--gray-100); vertical-align: middle;
  }
  .perf-table tr:last-child td { border-bottom: none; }
  .perf-table tbody tr:not(.total-row):hover td { background: var(--gray-50); }
  .total-row td { background: var(--gray-50); font-weight: 700; color: var(--gray-600); }

  .cr-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .cr-bar-bg { flex: 1; height: 6px; background: var(--gray-200); border-radius: 99px; min-width: 50px; }
  .cr-bar-fill { height: 6px; border-radius: 99px; }
  .cr-label { font-weight: 700; font-size: 13px; min-width: 36px; }

  .belum-btn {
    background: none; border: 1px solid var(--gray-300);
    padding: 3px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--gray-700); transition: all .15s;
  }
  .belum-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

  /* Modal */
  .perf-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .perf-modal-overlay.open { display: flex; }
  .perf-modal {
    background: var(--white); border-radius: var(--radius);
    width: 100%; max-width: 560px; max-height: 85vh;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .perf-modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .perf-modal-title { font-weight: 700; font-size: 15px; color: var(--gray-800); }
  .perf-modal-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .perf-modal-body { overflow-y: auto; padding: 20px; flex: 1; }

  .sub-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
  @media (max-width: 500px) { .sub-cards { grid-template-columns: repeat(2,1fr); } }

  .sub-card {
    background: var(--gray-50); border: 2px solid transparent;
    border-radius: 10px; padding: 10px 8px; text-align: center;
    cursor: pointer; transition: all .15s;
  }
  .sub-card:hover { border-color: var(--primary); background: var(--primary-light); }
  .sub-card.active { border-color: var(--primary); background: var(--primary-light); }
  .sub-card-label { font-size: 11px; color: var(--gray-400); font-weight: 500; margin-bottom: 4px; }
  .sub-card-value { font-size: 20px; font-weight: 700; color: var(--gray-700); }

  .sub-list { border-top: 1px solid var(--gray-100); padding-top: 4px; }
  .sub-list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px; border-bottom: 1px solid var(--gray-100); font-size: 13px;
  }
  .sub-list-item:last-child { border-bottom: none; }
  .sub-list-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; flex-shrink: 0;
  }

  .empty-perf { text-align: center; padding: 48px 20px; color: var(--gray-400); font-size: 14px; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="section-title" style="font-size:20px;">CS Performance</div>
    <button class="date-filter-btn" id="dateFilterBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="df-label">Last 30 Days</span> ▾
    </button>
  </div>

  <div id="perfContent">
    <div class="empty-perf">Loading...</div>
  </div>
</div>

<!-- Modal Belum Closing -->
<div class="perf-modal-overlay" id="belumModal" onclick="if(event.target===this)closeBelumModal()">
  <div class="perf-modal">
    <div class="perf-modal-header">
      <div>
        <div class="perf-modal-title" id="modalTitle">Belum Closing</div>
        <div class="perf-modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" onclick="closeBelumModal()">✕</button>
    </div>
    <div class="perf-modal-body">
      <div class="sub-cards" id="subCards"></div>
      <div class="sub-list" id="subList" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/date-filter.js"></script>
<script>
  requireAuth(true);
  renderNavbar('cs-performance');

  const BELUM_SET = new Set(['pasif','ongkir','harga','ooc','konsul','no_wa','blokir']);
  const SUB_LIST = [
    { key: 'pasif',  label: '😴 Pasif' },
    { key: 'ongkir', label: '🚚 Ongkir' },
    { key: 'harga',  label: '💰 Harga' },
    { key: 'ooc',    label: '📦 OOC' },
    { key: 'konsul', label: '💬 Konsul' },
    { key: 'no_wa',  label: '📵 No. WA' },
    { key: 'blokir', label: '🚫 Blokir' },
  ];

  let _from = null, _to = null;
  let _modalOrders = [], _activeSubKey = null;
  let _modalCsId = null, _modalProductId = null;

  const dateFilter = new DateFilter(
    document.getElementById('dateFilterBtn'),
    ({ from, to }) => { _from = from; _to = to; loadPerformance(); }
  );

  function crColor(cr) {
    return cr >= 60 ? 'var(--green)' : cr >= 35 ? 'var(--primary)' : 'var(--red)';
  }

  function toggleProduct(pid) {
    const body    = document.getElementById(`perf-body-${pid}`);
    const chevron = document.getElementById(`perf-chev-${pid}`);
    const isOpen  = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  }

  async function loadPerformance() {
    document.getElementById('perfContent').innerHTML = '<div class="empty-perf">Loading...</div>';
    try {
      const dateQ = _from && _to
        ? `&created_at=gte.${_from.toISOString()}&created_at=lte.${_to.toISOString()}` : '';

      const [orders, products, csTeam] = await Promise.all([
        sbGetAll('orders', `?select=product_id,cs_id,status${dateQ}`),
        sbGet('products', '?select=id,name,image_url&status=eq.active&order=name.asc'),
        sbGet('cs_team', '?select=id,name&order=name.asc'),
      ]);

      if (!orders.length) {
        document.getElementById('perfContent').innerHTML = '<div class="empty-perf">Tidak ada data di periode ini.</div>';
        return;
      }

      const csMap      = Object.fromEntries(csTeam.map(c => [c.id, c.name]));
      const productMap = Object.fromEntries(products.map(p => [p.id, p]));

      // Group orders: product → cs
      const byProduct = {};
      orders.forEach(o => {
        if (!o.product_id) return;
        if (!byProduct[o.product_id]) byProduct[o.product_id] = {};
        const csKey = o.cs_id || '__none__';
        if (!byProduct[o.product_id][csKey]) byProduct[o.product_id][csKey] = [];
        byProduct[o.product_id][csKey].push(o);
      });

      const productIds = products.map(p => p.id).filter(id => byProduct[id]);
      if (!productIds.length) {
        document.getElementById('perfContent').innerHTML = '<div class="empty-perf">Tidak ada data di periode ini.</div>';
        return;
      }

      let html = '';
      productIds.forEach(pid => {
        const p      = productMap[pid] || {};
        const pName  = p.name || 'Produk';
        const pImg   = p.image_url;
        const csData = byProduct[pid];
        const csIds  = Object.keys(csData).sort((a, b) =>
          (csMap[a] || 'Tanpa CS').localeCompare(csMap[b] || 'Tanpa CS')
        );

        const allPOrders   = csIds.flatMap(cid => csData[cid]);
        const totalLead    = allPOrders.length;
        const totalClosing = allPOrders.filter(o => o.status === 'closing').length;
        const totalBelum   = allPOrders.filter(o => BELUM_SET.has(o.status)).length;
        const totalCR      = totalLead > 0 ? Math.round(totalClosing / totalLead * 100) : 0;
        const totalColor   = crColor(totalCR);

        // Foto atau placeholder
        const imgHtml = pImg
          ? `<img class="perf-product-img" src="${pImg}" alt="${pName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
             <div class="perf-product-img-placeholder" style="display:none;">📦</div>`
          : `<div class="perf-product-img-placeholder">📦</div>`;

        // Rows CS
        let rows = csIds.map(cid => {
          const csOrders = csData[cid];
          const csName   = csMap[cid] || 'Tanpa CS';
          const lead     = csOrders.length;
          const closing  = csOrders.filter(o => o.status === 'closing').length;
          const belum    = csOrders.filter(o => BELUM_SET.has(o.status)).length;
          const cr       = lead > 0 ? Math.round(closing / lead * 100) : 0;
          const color    = crColor(cr);
          const ordersJson = JSON.stringify(csOrders).replace(/'/g, '&#39;');

          return `
            <tr>
              <td><span style="font-weight:600;">${csName}</span></td>
              <td>${lead.toLocaleString('id-ID')}</td>
              <td>${closing.toLocaleString('id-ID')}</td>
              <td>
                <div class="cr-bar-wrap">
                  <div class="cr-bar-bg"><div class="cr-bar-fill" style="width:${cr}%;background:${color};"></div></div>
                  <span class="cr-label" style="color:${color};">${cr}%</span>
                </div>
              </td>
              <td>
                ${belum > 0
                  ? `<button class="belum-btn" onclick='openBelumModal(${JSON.stringify(cid)},${JSON.stringify(pid)},${JSON.stringify(csName)},${JSON.stringify(pName)})'>${belum.toLocaleString('id-ID')} →</button>`
                  : `<span style="color:var(--gray-300);font-size:12px;">—</span>`
                }
              </td>
            </tr>`;
        }).join('');

        // Baris total
        rows += `
          <tr class="total-row">
            <td style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;">Total</td>
            <td>${totalLead.toLocaleString('id-ID')}</td>
            <td>${totalClosing.toLocaleString('id-ID')}</td>
            <td>
              <div class="cr-bar-wrap">
                <div class="cr-bar-bg"><div class="cr-bar-fill" style="width:${totalCR}%;background:${totalColor};"></div></div>
                <span class="cr-label" style="color:${totalColor};">${totalCR}%</span>
              </div>
            </td>
            <td><span style="color:var(--gray-500);font-size:12px;">${totalBelum.toLocaleString('id-ID')}</span></td>
          </tr>`;

        html += `
          <div class="perf-section">
            <div class="perf-product-header" onclick="toggleProduct('${pid}')">
              ${imgHtml}
              <div class="perf-product-info">
                <div class="perf-product-name">${pName}</div>
                <div class="perf-product-meta">${totalLead} lead · ${totalClosing} closing · CR ${totalCR}%</div>
              </div>
              <span class="perf-chevron" id="perf-chev-${pid}">▸</span>
            </div>
            <div class="perf-body" id="perf-body-${pid}">
              <div class="table-wrap">
                <table class="perf-table">
                  <thead>
                    <tr>
                      <th>CS</th>
                      <th>Lead</th>
                      <th>Closing</th>
                      <th style="min-width:130px;">Closing Rate</th>
                      <th>Belum Closing</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>`;
      });

      document.getElementById('perfContent').innerHTML = html;
    } catch(e) {
      document.getElementById('perfContent').innerHTML = `<div class="empty-perf">Gagal load data: ${e.message}</div>`;
    }
  }

  // ── Modal Belum Closing — lazy fetch saat dibuka ──
  async function openBelumModal(csId, productId, csName, productName) {
    _modalCsId = csId; _modalProductId = productId;
    _activeSubKey = null;
    _modalOrders  = [];

    document.getElementById('modalTitle').textContent = `Belum Closing — ${csName}`;
    document.getElementById('modalSub').textContent   = productName;
    document.getElementById('subList').style.display  = 'none';
    document.getElementById('subList').innerHTML      = '';
    document.getElementById('subCards').innerHTML     = '<div style="text-align:center;padding:20px;color:var(--gray-400);font-size:13px;">Loading...</div>';
    document.getElementById('belumModal').classList.add('open');

    try {
      const dateQ = _from && _to
        ? `&created_at=gte.${_from.toISOString()}&created_at=lte.${_to.toISOString()}` : '';
      const csQ   = csId === '__none__' ? '&cs_id=is.null' : `&cs_id=eq.${csId}`;
      const statusQ = SUB_LIST.map(s => s.key).join(',');

      const orders = await sbGet('orders',
        `?product_id=eq.${productId}${csQ}&status=in.(${statusQ})${dateQ}&select=customer_name,customer_wa,status&order=created_at.desc`
      );
      _modalOrders = orders;
    } catch(e) {
      document.getElementById('subCards').innerHTML = `<div style="color:var(--red);font-size:13px;">Gagal load: ${e.message}</div>`;
      return;
    }

    renderSubCards();
  }

  function closeBelumModal() {
    document.getElementById('belumModal').classList.remove('open');
    _modalOrders = []; _activeSubKey = null;
    _modalCsId = null; _modalProductId = null;
  }

  function renderSubCards() {
    document.getElementById('subCards').innerHTML = SUB_LIST.map(s => {
      const count = _modalOrders.filter(o => o.status === s.key).length;
      return `
        <div class="sub-card ${_activeSubKey === s.key ? 'active' : ''}" onclick="toggleSubList('${s.key}')">
          <div class="sub-card-label">${s.label}</div>
          <div class="sub-card-value">${count}</div>
        </div>`;
    }).join('');
  }

  function toggleSubList(key) {
    if (_activeSubKey === key) {
      _activeSubKey = null;
      document.getElementById('subList').style.display = 'none';
      document.getElementById('subList').innerHTML = '';
    } else {
      _activeSubKey = key;
      const filtered = _modalOrders.filter(o => o.status === key);
      const label    = SUB_LIST.find(s => s.key === key)?.label || key;
      document.getElementById('subList').innerHTML = `
        <div style="padding:10px 4px 6px;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;">
          ${label} · ${filtered.length} order
        </div>
        ${filtered.length ? filtered.map(o => `
          <div class="sub-list-item">
            <div class="sub-list-avatar">${(o.customer_name||'?')[0].toUpperCase()}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;">${o.customer_name||'-'}</div>
              <div style="font-size:12px;color:var(--gray-400);">💬 ${o.customer_wa||'-'}</div>
            </div>
          </div>`).join('')
        : '<div style="padding:16px;text-align:center;color:var(--gray-400);font-size:13px;">Tidak ada order</div>'
        }`;
      document.getElementById('subList').style.display = 'block';
    }
    renderSubCards();
  }
</script>
</body>
</html>

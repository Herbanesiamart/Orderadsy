<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--gray-500); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="section-title" style="font-size:20px;">Dashboard</div>
    <button class="date-filter-btn" id="dateFilterBtn">📅 <span class="df-label">Last 30 Days</span> ▾</button>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card">
      <div class="kpi-icon blue">🛒</div>
      <div class="kpi-label">Total Orders</div>
      <div class="kpi-value blue" id="kpiOrders">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green">✅</div>
      <div class="kpi-label">Total Closing</div>
      <div class="kpi-value green" id="kpiClosing">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon orange">%</div>
      <div class="kpi-label">Closing Rate</div>
      <div class="kpi-value orange" id="kpiRate">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon red">⏳</div>
      <div class="kpi-label">Pending Orders</div>
      <div class="kpi-value red" id="kpiPending">—</div>
    </div>
  </div>

  <!-- Chart + Recent -->
  <div class="dashboard-grid">
    <div class="card card-body">
      <div class="chart-header">
        <div>
          <div class="section-title">Transaksi</div>
          <div class="chart-legend mt-4">
            <span><span class="legend-dot" style="background:#2563EB"></span>Closing</span>
            <span><span class="legend-dot" style="background:#BFDBFE"></span>Orders</span>
          </div>
        </div>
      </div>
      <canvas id="txChart" style="max-height:220px;"></canvas>
    </div>

    <div class="card card-body" style="display:flex;flex-direction:column;">
      <div class="section-title mb-16">Order Terbaru</div>
      <div id="recentOrders" style="overflow-y:auto;max-height:220px;flex:1;">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">Belum ada order</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/date-filter.js"></script>
<script>
  requireAuth();
  renderNavbar('dashboard');

  let chart = null;
  let dateFilter;
  let _currentFrom = null;
  let _currentTo   = null;

  // Reload saat tab aktif kembali
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadDashboard(_currentFrom, _currentTo);
    }
  });

  // Init DateFilter after DOM ready
  window.addEventListener('DOMContentLoaded', () => {
    dateFilter = new DateFilter(
      document.getElementById('dateFilterBtn'),
      ({ from, to }) => {
        _currentFrom = from;
        _currentTo   = to;
        loadDashboard(from, to);
      }
    );
  });

  // Supabase Realtime — listen INSERT & UPDATE orders
  function initRealtime() {
    const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    _sb.channel('dashboard-orders')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'orders' },
        () => {
          loadDashboard(_currentFrom, _currentTo);
          showToast('Order baru masuk!', 'success');
          playOrderSound();
        }
      )
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'orders' },
        () => loadDashboard(_currentFrom, _currentTo)
      )
      .subscribe();
  }
  initRealtime();

  // Fast count query via Supabase Content-Range header
  async function sbCount(table, filter = '') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=id${filter}`, {
      headers: { ...getSupabaseHeaders(), 'Prefer': 'count=exact', 'Range': '0-0' },
    });
    const cr = r.headers.get('Content-Range') || '';
    return parseInt(cr.split('/')[1] || '0') || 0;
  }

  async function loadDashboard(from, to) {
    const csFilter = getCSId() ? `&cs_id=eq.${getCSId()}` : '';
    try {
      const dateF = from && to
        ? `&created_at=gte.${from.toISOString()}&created_at=lte.${to.toISOString()}`
        : '';
      const baseFilter = `${dateF}${csFilter}`;

      // Parallel count queries — jauh lebih cepat dari fetch semua baris
      const [total, closing, pending] = await Promise.all([
        sbCount('orders', baseFilter),
        sbCount('orders', `${baseFilter}&status=eq.closing`),
        sbCount('orders', `${baseFilter}&status=eq.pending`),
      ]);

      const rate = total > 0 ? Math.round(closing / total * 100) : 0;
      document.getElementById('kpiOrders').textContent  = total.toLocaleString('id-ID');
      document.getElementById('kpiClosing').textContent = closing.toLocaleString('id-ID');
      document.getElementById('kpiRate').textContent    = rate + '%';
      document.getElementById('kpiPending').textContent = pending.toLocaleString('id-ID');

      // Chart: fetch hanya created_at + status, limit 2000
      const chartParams = [`select=status,created_at`, `limit=2000`];
      if (from && to) {
        chartParams.push(`created_at=gte.${from.toISOString()}`);
        chartParams.push(`created_at=lte.${to.toISOString()}`);
      }
      if (getCSId()) chartParams.push(`cs_id=eq.${getCSId()}`);
      const orders = await sbGet('orders', '?' + chartParams.join('&'));
      buildChart(orders, from, to);
    } catch(e) {
      console.error(e);
    }

    try {
      const recent = await sbGet('orders', `?select=id,customer_name,status,created_at,product_id,products(name)&order=created_at.desc&limit=8${csFilter}`);
      renderRecent(recent);
    } catch(e) {}
  }

  function buildChart(orders, from, to) {
    const labels = [];
    const ordersData  = [];
    const closingData = [];

    if (from && to) {
      // Iterate day by day
      const cur = new Date(from);
      cur.setHours(0, 0, 0, 0);
      const end = new Date(to);
      end.setHours(0, 0, 0, 0);

      while (cur <= end) {
        const label  = cur.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
        labels.push(label);
        const dayStr = cur.toISOString().slice(0, 10);
        const dayOrders = orders.filter(o => o.created_at.slice(0, 10) === dayStr);
        ordersData.push(dayOrders.length);
        closingData.push(dayOrders.filter(o => o.status === 'closing').length);
        cur.setDate(cur.getDate() + 1);
      }
    } else {
      // "Semua" — group by month from earliest order
      const monthMap = {};
      orders.forEach(o => {
        const key = o.created_at.slice(0, 7); // "YYYY-MM"
        if (!monthMap[key]) monthMap[key] = { total: 0, closing: 0 };
        monthMap[key].total++;
        if (o.status === 'closing') monthMap[key].closing++;
      });
      Object.keys(monthMap).sort().forEach(key => {
        const [y, m] = key.split('-');
        labels.push(new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month:'short', year:'2-digit' }));
        ordersData.push(monthMap[key].total);
        closingData.push(monthMap[key].closing);
      });
    }

    if (chart) chart.destroy();
    const ctx = document.getElementById('txChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Orders',
            data: ordersData,
            backgroundColor: 'rgba(191,219,254,0.5)',
            borderColor: '#BFDBFE',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
          {
            label: 'Closing',
            data: closingData,
            backgroundColor: 'rgba(37,99,235,0.15)',
            borderColor: '#2563EB',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
          y: { grid: { color: '#F3F4F6' }, ticks: { font: { size: 11 } }, beginAtZero: true },
        },
      },
    });
  }

  function renderRecent(orders) {
    const el = document.getElementById('recentOrders');
    if (!orders.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Belum ada order</div></div>`;
      return;
    }
    const statusMap = { pending: ['badge-orange','Pending'], closing: ['badge-green','Closing'], cancel: ['badge-red','Cancel'] };
    el.innerHTML = orders.map(o => {
      const [cls, lbl] = statusMap[o.status] || ['badge-gray', o.status];
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${o.customer_name || '-'}</div>
            <div style="font-size:11px;color:var(--gray-400);">${o.products?.name || ''} · ${timeAgo(o.created_at)}</div>
          </div>
          <span class="badge ${cls}">${lbl}</span>
        </div>`;
    }).join('');
  }
</script>
</body>
</html>

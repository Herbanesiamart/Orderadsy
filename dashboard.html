<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--gray-500); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .belum-stat-card { background: var(--gray-50); border-radius: 10px; padding: 14px 12px; text-align: center; cursor: pointer; transition: background .15s, transform .15s; }
  .belum-stat-card:hover { background: var(--blue-light, #EFF6FF); transform: translateY(-2px); }
  .belum-stat-label { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 6px; }
  .belum-stat-value { font-size: 24px; font-weight: 700; color: var(--gray-700); }
  .belum-order-item { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--gray-100); }
  .belum-order-item:last-child { border-bottom: none; }
  .belum-order-item:hover { background: var(--gray-50); }
  @media (max-width: 700px) { #belumClosingGrid { grid-template-columns: repeat(3,1fr) !important; } }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="section-title" style="font-size:20px;">Dashboard</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <select class="form-control" id="productFilter" style="width:180px;" onchange="loadDashboard(_currentFrom,_currentTo)">
        <option value="">Semua Produk</option>
      </select>
      <button class="date-filter-btn" id="dateFilterBtn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="df-label">Last 30 Days</span> ▾</button>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card">
      <div class="kpi-icon blue"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
      <div class="kpi-label">Total Orders</div>
      <div class="kpi-value blue" id="kpiOrders">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
      <div class="kpi-label">Total Closing</div>
      <div class="kpi-value green" id="kpiClosing">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon orange"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
      <div class="kpi-label">Closing Rate</div>
      <div class="kpi-value orange" id="kpiRate">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon red"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="kpi-label">Belum Closing</div>
      <div class="kpi-value red" id="kpiPending">—</div>
    </div>
  </div>

  <!-- Chart + Recent -->
  <div class="dashboard-grid">
    <div class="card card-body">
      <div class="chart-header">
        <div>
          <div class="section-title">Transaksi</div>
          <div class="chart-legend mt-4">
            <span><span class="legend-dot" style="background:#2563EB"></span>Closing</span>
            <span><span class="legend-dot" style="background:#BFDBFE"></span>Orders</span>
          </div>
        </div>
      </div>
      <canvas id="txChart" style="max-height:220px;"></canvas>
    </div>

    <div class="card card-body" style="display:flex;flex-direction:column;">
      <div class="section-title mb-16">Order Terbaru</div>
      <div id="recentOrders" style="overflow-y:auto;max-height:220px;flex:1;">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">Belum ada order</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Belum Closing Breakdown -->
  <div class="card card-body" style="margin-top:8px;">
    <div class="section-title mb-16">Breakdown Belum Closing</div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;" id="belumClosingGrid">
      <div class="belum-stat-card" onclick="openBelumModal('pasif','Pasif')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>Pasif</div>
        <div class="belum-stat-value" id="bcPasif">—</div>
      </div>
      <div class="belum-stat-card" onclick="openBelumModal('ongkir','Ongkir')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Ongkir</div>
        <div class="belum-stat-value" id="bcOngkir">—</div>
      </div>
      <div class="belum-stat-card" onclick="openBelumModal('harga','Harga')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Harga</div>
        <div class="belum-stat-value" id="bcHarga">—</div>
      </div>
      <div class="belum-stat-card" onclick="openBelumModal('ooc','OOC')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><line x1="12" y1="12" x2="12" y2="12.01"/></svg>OOC</div>
        <div class="belum-stat-value" id="bcOOC">—</div>
      </div>
      <div class="belum-stat-card" onclick="openBelumModal('konsul','Konsul')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Konsul</div>
        <div class="belum-stat-value" id="bcKonsul">—</div>
      </div>
      <div class="belum-stat-card" onclick="openBelumModal('no_wa','No. WA')">
        <div class="belum-stat-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 4.43 9.88a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.34 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.32 8.91"/><line x1="1" y1="1" x2="23" y2="23"/></svg>No. WA</div>
        <div class="belum-stat-value" id="bcNoWa">—</div>
      </div>
    </div>

    <!-- Detail panel expand di bawah grid -->
    <div id="belumDetail" style="display:none;margin-top:16px;border-top:1px solid var(--gray-100);padding-top:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="font-weight:600;font-size:14px;" id="belumDetailTitle">—</div>
        <button class="btn btn-outline btn-sm" onclick="closeBelumDetail()">✕ Tutup</button>
      </div>
      <div id="belumDetailBody"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/date-filter.js"></script>
<script>
  requireAuth();
  renderNavbar('dashboard');

  let chart = null;
  let dateFilter;
  let _currentFrom = null;
  let _currentTo   = null;
  let _currentProductId = null;

  // Reload saat tab aktif kembali
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadDashboard(_currentFrom, _currentTo);
    }
  });

  // Init DateFilter + load products after DOM ready
  window.addEventListener('DOMContentLoaded', async () => {
    dateFilter = new DateFilter(
      document.getElementById('dateFilterBtn'),
      ({ from, to }) => {
        _currentFrom = from;
        _currentTo   = to;
        loadDashboard(from, to);
      }
    );

    // Load products untuk filter — CS hanya lihat produk miliknya
    try {
      let productsQuery = '?select=id,name&order=name.asc';
      if (getCSId()) {
        // Ambil product_id yang di-assign ke CS ini
        const assigned = await sbGet('product_cs', `?cs_id=eq.${getCSId()}&select=product_id`);
        const ids = assigned.map(a => a.product_id).join(',');
        if (ids) productsQuery = `?id=in.(${ids})&select=id,name&order=name.asc`;
        else return; // CS tidak punya produk
      }
      const products = await sbGet('products', productsQuery);
      const sel = document.getElementById('productFilter');
      products.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    } catch(e) {}
  });

  // Supabase Realtime — listen INSERT & UPDATE orders
  function initRealtime() {
    const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    _sb.channel('dashboard-orders')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'orders' },
        () => {
          loadDashboard(_currentFrom, _currentTo);
        }
      )
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'orders' },
        () => loadDashboard(_currentFrom, _currentTo)
      )
      .subscribe();
  }
  initRealtime();

  const BELUM_SET = new Set(['pasif','ongkir','harga','ooc','konsul','no_wa']);

  async function loadDashboard(from, to) {
    _currentProductId = document.getElementById('productFilter')?.value || '';
    const csFilter      = getCSId()            ? `&cs_id=eq.${getCSId()}`                  : '';
    const productFilter = _currentProductId    ? `&product_id=eq.${_currentProductId}`     : '';

    try {
      // 1 fetch untuk semua KPI + chart data
      const params = [`select=status,created_at`];
      if (from && to) {
        params.push(`created_at=gte.${from.toISOString()}`);
        params.push(`created_at=lte.${to.toISOString()}`);
      }
      if (getCSId())         params.push(`cs_id=eq.${getCSId()}`);
      if (_currentProductId) params.push(`product_id=eq.${_currentProductId}`);

      const [orders, recent] = await Promise.all([
        sbGet('orders', '?' + params.join('&')),
        sbGet('orders', `?select=id,customer_name,status,created_at,product_id,products(name)&order=created_at.desc&limit=8${csFilter}${productFilter}${from && to ? `&created_at=gte.${from.toISOString()}&created_at=lte.${to.toISOString()}` : ''}`),
      ]);

      // Hitung semua KPI client-side dari 1 dataset
      const total       = orders.length;
      const closing     = orders.filter(o => o.status === 'closing').length;
      const belumClosing= total - closing; // semua yang bukan closing = belum closing
      const bcPasif     = orders.filter(o => o.status === 'pasif').length;
      const bcOngkir    = orders.filter(o => o.status === 'ongkir').length;
      const bcHarga     = orders.filter(o => o.status === 'harga').length;
      const bcOOC       = orders.filter(o => o.status === 'ooc').length;
      const bcKonsul    = orders.filter(o => o.status === 'konsul').length;
      const bcNoWa      = orders.filter(o => o.status === 'no_wa').length;
      const rate        = total > 0 ? Math.round(closing / total * 100) : 0;

      document.getElementById('kpiOrders').textContent  = total.toLocaleString('id-ID');
      document.getElementById('kpiClosing').textContent = closing.toLocaleString('id-ID');
      document.getElementById('kpiRate').textContent    = rate + '%';
      document.getElementById('kpiPending').textContent = belumClosing.toLocaleString('id-ID');
      document.getElementById('bcPasif').textContent    = bcPasif.toLocaleString('id-ID');
      document.getElementById('bcOngkir').textContent   = bcOngkir.toLocaleString('id-ID');
      document.getElementById('bcHarga').textContent    = bcHarga.toLocaleString('id-ID');
      document.getElementById('bcOOC').textContent      = bcOOC.toLocaleString('id-ID');
      document.getElementById('bcKonsul').textContent   = bcKonsul.toLocaleString('id-ID');
      document.getElementById('bcNoWa').textContent     = bcNoWa.toLocaleString('id-ID');

      buildChart(orders, from, to);
      renderRecent(recent);
    } catch(e) {
      console.error(e);
    }
  }

  function buildChart(orders, from, to) {
    const WIB = 7 * 60 * 60 * 1000;
    const labels = [];
    const ordersData  = [];
    const closingData = [];

    // Konversi created_at UTC → date string WIB (YYYY-MM-DD)
    function wibDateStr(isoStr) {
      const d = new Date(new Date(isoStr).getTime() + WIB);
      return d.getUTCFullYear() + '-' +
             String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
             String(d.getUTCDate()).padStart(2, '0');
    }

    if (from && to) {
      // from = WIB midnight of first day (as UTC ms), iterate per hari
      let curMs = from.getTime();
      const endMs = to.getTime();

      while (curMs <= endMs) {
        const wibDay = new Date(curMs + WIB); // shift ke WIB untuk baca tanggal
        const dayStr = wibDay.getUTCFullYear() + '-' +
                       String(wibDay.getUTCMonth() + 1).padStart(2, '0') + '-' +
                       String(wibDay.getUTCDate()).padStart(2, '0');
        const label = wibDay.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
        labels.push(label);
        const dayOrders = orders.filter(o => wibDateStr(o.created_at) === dayStr);
        ordersData.push(dayOrders.length);
        closingData.push(dayOrders.filter(o => o.status === 'closing').length);
        curMs += 86400000; // +1 hari
      }
    } else {
      // "Semua" — group by bulan WIB
      const monthMap = {};
      orders.forEach(o => {
        const key = wibDateStr(o.created_at).slice(0, 7); // "YYYY-MM" WIB
        if (!monthMap[key]) monthMap[key] = { total: 0, closing: 0 };
        monthMap[key].total++;
        if (o.status === 'closing') monthMap[key].closing++;
      });
      Object.keys(monthMap).sort().forEach(key => {
        const [y, m] = key.split('-');
        labels.push(new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month:'short', year:'2-digit' }));
        ordersData.push(monthMap[key].total);
        closingData.push(monthMap[key].closing);
      });
    }

    if (chart) chart.destroy();
    const ctx = document.getElementById('txChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Orders',
            data: ordersData,
            backgroundColor: 'rgba(191,219,254,0.5)',
            borderColor: '#BFDBFE',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
          {
            label: 'Closing',
            data: closingData,
            backgroundColor: 'rgba(37,99,235,0.15)',
            borderColor: '#2563EB',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
          y: { grid: { color: '#F3F4F6' }, ticks: { font: { size: 11 } }, beginAtZero: true },
        },
      },
    });
  }

  function renderRecent(orders) {
    const el = document.getElementById('recentOrders');
    if (!orders.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Belum ada order</div></div>`;
      return;
    }
    const statusMap = {
      pending: ['badge-orange', 'Pending'],
      closing: ['badge-green',  'Closing'],
      cancel:  ['badge-red',    'Cancel'],
      pasif:   ['badge-gray',   'Pasif'],
      ongkir:  ['badge-purple', 'Ongkir'],
      harga:   ['badge-purple', 'Harga'],
      ooc:     ['badge-gray',   'OOC'],
      konsul:  ['badge-blue',   'Konsul'],
      no_wa:   ['badge-red',    'No. WA'],
    };
    el.innerHTML = orders.map(o => {
      const [cls, lbl] = statusMap[o.status] || ['badge-gray', o.status];
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${o.customer_name || '-'}</div>
            <div style="font-size:11px;color:var(--gray-400);">${o.products?.name || ''} · ${timeAgo(o.created_at)}</div>
          </div>
          <span class="badge ${cls}">${lbl}</span>
        </div>`;
    }).join('');
  }

  let _activeStatus = null;

  async function openBelumModal(status, label) {
    // Toggle: klik lagi status yang sama → tutup
    if (_activeStatus === status) {
      closeBelumDetail();
      return;
    }
    _activeStatus = status;

    // Highlight card aktif
    document.querySelectorAll('.belum-stat-card').forEach(c => c.style.background = '');
    event.currentTarget.style.background = 'var(--blue-light, #EFF6FF)';

    const detail  = document.getElementById('belumDetail');
    const title   = document.getElementById('belumDetailTitle');
    const body    = document.getElementById('belumDetailBody');

    title.textContent = label;
    body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--gray-400);">Loading...</div>`;
    detail.style.display = 'block';

    try {
      const csFilter      = getCSId()         ? `&cs_id=eq.${getCSId()}`              : '';
      const productFilter = _currentProductId ? `&product_id=eq.${_currentProductId}` : '';
      const dateF = _currentFrom && _currentTo
        ? `&created_at=gte.${_currentFrom.toISOString()}&created_at=lte.${_currentTo.toISOString()}`
        : '';
      const orders = await sbGet('orders', `?status=eq.${status}${dateF}${csFilter}${productFilter}&select=id,customer_name,customer_wa,customer_address,customer_city,created_at,fu_count,last_fu_at,products(name,followup_templates),cs_team(name)&order=created_at.desc`);

      if (!orders.length) {
        body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--gray-400);">Tidak ada order dengan status ini</div>`;
        return;
      }

      body.innerHTML = orders.map(o => {
        const waNum = (o.customer_wa || '').replace(/\D/g, '');
        const template = o.products?.followup_templates?.[status] ||
          'Halo Kak {{name}}, saya {{cs_name}}. Mau follow up mengenai orderan {{product}} kak, ada yang bisa kami bantu? 😊';
        const msg = template
          .replace(/\{\{name\}\}/gi,    o.customer_name || '')
          .replace(/\{\{cs_name\}\}/gi, o.cs_team?.name || '')
          .replace(/\{\{phone\}\}/gi,   o.customer_wa || '')
          .replace(/\{\{address\}\}/gi, [o.customer_address, o.customer_city].filter(Boolean).join(', '))
          .replace(/\{\{product\}\}/gi, o.products?.name || '');
        const waUrl = `https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`;
        const fuBadge = o.fu_count
          ? `<span style="font-size:11px;color:var(--primary);font-weight:500;">FU ${o.fu_count}x · ${timeAgo(o.last_fu_at)}</span>`
          : `<span style="font-size:11px;color:var(--gray-400);">Belum FU</span>`;
        return `
        <div class="belum-order-item">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:14px;">${o.customer_name || '-'}</div>
            <div style="font-size:12px;color:var(--gray-400);margin-top:2px;">
              💬 ${o.customer_wa || '-'} &nbsp;·&nbsp; ${o.products?.name || '-'}
            </div>
            <div style="font-size:11px;color:var(--gray-400);margin-top:1px;">
              CS: ${o.cs_team?.name || '-'} &nbsp;·&nbsp; ${timeAgo(o.created_at)}
            </div>
            <div style="margin-top:3px;" id="dash-fu-${o.id}">${fuBadge}</div>
          </div>
          <a href="${waUrl}" target="_blank" class="btn btn-accent btn-sm" style="white-space:nowrap;flex-shrink:0;" onclick="dashRecordFU('${o.id}')">💬 Follow Up</a>
        </div>`;
      }).join('');
    } catch(e) {
      body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--red);">Gagal load</div>`;
    }
  }

  async function dashRecordFU(id) {
    try {
      const res = await sbGet('orders', `?id=eq.${id}&select=fu_count,last_fu_at`);
      const cur = res[0] || {};
      const newCount = (cur.fu_count || 0) + 1;
      const now = new Date().toISOString();
      await sbPatch('orders', `?id=eq.${id}`, { fu_count: newCount, last_fu_at: now });
      const el = document.getElementById('dash-fu-' + id);
      if (el) el.innerHTML = `<span style="font-size:11px;color:var(--primary);font-weight:500;">FU ${newCount}x · baru saja</span>`;
    } catch(e) {}
  }

  function closeBelumDetail() {
    _activeStatus = null;
    document.getElementById('belumDetail').style.display = 'none';
    document.querySelectorAll('.belum-stat-card').forEach(c => c.style.background = '');
  }
</script>
</body>
</html>

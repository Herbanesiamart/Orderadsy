<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
  .date-filter-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: var(--white);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-700);
    position: relative;
  }
  .date-filter-btn:hover { background: var(--gray-50); }
  .filter-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 6px;
    z-index: 100;
    min-width: 160px;
    display: none;
  }
  .filter-dropdown.open { display: block; }
  .filter-opt {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--gray-700);
  }
  .filter-opt:hover  { background: var(--gray-100); }
  .filter-opt.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--gray-500); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="section-title" style="font-size:20px;">Dashboard</div>
    <div style="position:relative;">
      <button class="date-filter-btn" onclick="toggleFilter()">
        📅 <span id="filterLabel">Last 30 Days</span> ▾
      </button>
      <div class="filter-dropdown" id="filterDropdown">
        <div class="filter-opt active" onclick="setFilter(7,'Last 7 Days',this)">Last 7 Days</div>
        <div class="filter-opt" onclick="setFilter(30,'Last 30 Days',this)">Last 30 Days</div>
        <div class="filter-opt" onclick="setFilter(90,'Last 90 Days',this)">Last 90 Days</div>
      </div>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card">
      <div class="kpi-icon blue">🛒</div>
      <div class="kpi-label">Total Orders</div>
      <div class="kpi-value blue" id="kpiOrders">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green">✅</div>
      <div class="kpi-label">Total Closing</div>
      <div class="kpi-value green" id="kpiClosing">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon orange">%</div>
      <div class="kpi-label">Closing Rate</div>
      <div class="kpi-value orange" id="kpiRate">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon red">⏳</div>
      <div class="kpi-label">Pending Orders</div>
      <div class="kpi-value red" id="kpiPending">—</div>
    </div>
  </div>

  <!-- Chart + Recent -->
  <div class="dashboard-grid">
    <div class="card card-body">
      <div class="chart-header">
        <div>
          <div class="section-title">Transaksi</div>
          <div class="chart-legend mt-4">
            <span><span class="legend-dot" style="background:#2563EB"></span>Closing</span>
            <span><span class="legend-dot" style="background:#BFDBFE"></span>Orders</span>
          </div>
        </div>
      </div>
      <canvas id="txChart" height="200"></canvas>
    </div>

    <div class="card card-body">
      <div class="section-title mb-16">Order Terbaru</div>
      <div id="recentOrders">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">Belum ada order</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script>
  requireAuth();
  renderNavbar('dashboard');

  let filterDays = 30;
  let chart = null;

  function toggleFilter() {
    document.getElementById('filterDropdown').classList.toggle('open');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.date-filter-btn')) {
      document.getElementById('filterDropdown').classList.remove('open');
    }
  });

  function setFilter(days, label, el) {
    filterDays = days;
    document.getElementById('filterLabel').textContent = label;
    document.querySelectorAll('.filter-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('filterDropdown').classList.remove('open');
    loadDashboard();
  }

  async function loadDashboard() {
    const csFilter = getCSId() ? `&cs_id=eq.${getCSId()}` : '';
    try {
      const since = new Date(Date.now() - filterDays * 86400000).toISOString();
      const orders = await sbGet('orders', `?created_at=gte.${since}${csFilter}&select=id,status,created_at`);

      const total   = orders.length;
      const closing = orders.filter(o => o.status === 'closing').length;
      const pending = orders.filter(o => o.status === 'pending').length;
      const rate    = total > 0 ? Math.round(closing / total * 100) : 0;

      document.getElementById('kpiOrders').textContent  = total.toLocaleString('id-ID');
      document.getElementById('kpiClosing').textContent = closing.toLocaleString('id-ID');
      document.getElementById('kpiRate').textContent    = rate + '%';
      document.getElementById('kpiPending').textContent = pending.toLocaleString('id-ID');

      buildChart(orders, filterDays);
    } catch(e) {
      console.error(e);
    }

    try {
      const recent = await sbGet('orders', `?select=id,customer_name,status,created_at,product_id,products(name)&order=created_at.desc&limit=8${csFilter}`);
      renderRecent(recent);
    } catch(e) {}
  }

  function buildChart(orders, days) {
    const labels = [];
    const ordersData  = [];
    const closingData = [];

    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const label = d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
      labels.push(label);
      const dayStr = d.toISOString().slice(0, 10);
      const dayOrders  = orders.filter(o => o.created_at.slice(0,10) === dayStr);
      ordersData.push(dayOrders.length);
      closingData.push(dayOrders.filter(o => o.status === 'closing').length);
    }

    if (chart) chart.destroy();
    const ctx = document.getElementById('txChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Orders',
            data: ordersData,
            backgroundColor: 'rgba(191,219,254,0.5)',
            borderColor: '#BFDBFE',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
          {
            label: 'Closing',
            data: closingData,
            backgroundColor: 'rgba(37,99,235,0.15)',
            borderColor: '#2563EB',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
          y: { grid: { color: '#F3F4F6' }, ticks: { font: { size: 11 } }, beginAtZero: true },
        },
      },
    });
  }

  function renderRecent(orders) {
    const el = document.getElementById('recentOrders');
    if (!orders.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Belum ada order</div></div>`;
      return;
    }
    const statusMap = { pending: ['badge-orange','Pending'], closing: ['badge-green','Closing'], cancel: ['badge-red','Cancel'] };
    el.innerHTML = orders.map(o => {
      const [cls, lbl] = statusMap[o.status] || ['badge-gray', o.status];
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${o.customer_name || '-'}</div>
            <div style="font-size:11px;color:var(--gray-400);">${o.products?.name || ''} · ${timeAgo(o.created_at)}</div>
          </div>
          <span class="badge ${cls}">${lbl}</span>
        </div>`;
    }).join('');
  }

  loadDashboard();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — OrderAdsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--gray-50); }
  .login-wrap { width: 100%; max-width: 380px; padding: 20px; }
  .login-card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-md); padding: 36px 32px; }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo h1 { font-size: 22px; font-weight: 800; color: var(--primary); }
  .login-logo h1 span { color: var(--accent); }
  .login-logo p { font-size: 13px; color: var(--gray-400); margin-top: 4px; }
  .login-title { font-size: 18px; font-weight: 700; color: var(--gray-800); margin-bottom: 20px; }
  .error-msg { background: var(--red-light); color: var(--red); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <h1>Order<span>Adsy</span></h1>
      <p>Order Management System</p>
    </div>
    <div class="login-title">Masuk ke Dashboard</div>
    <div class="error-msg" id="errorMsg">Email/username atau password salah.</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email / Username</label>
        <input type="text" class="form-control" id="username" placeholder="Email atau username admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:8px;">
        Masuk
      </button>
    </form>
  </div>
</div>
<script src="js/config.js"></script>
<script>
  if (isLoggedIn()) window.location.href = 'dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    const btn = e.target.querySelector('button[type=submit]');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    // Coba login admin dulu
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      sessionStorage.setItem('oa_auth', JSON.stringify({ role: 'admin' }));
      window.location.href = 'dashboard.html';
      return;
    }

    // Coba login CS pakai email + password
    try {
      const res = await sbGet('cs_team', `?email=eq.${encodeURIComponent(u)}&select=id,name,email,password,is_active`);
      const cs = res[0];
      if (cs && cs.password === p && cs.is_active) {
        sessionStorage.setItem('oa_auth', JSON.stringify({ role: 'cs', cs_id: cs.id, cs_name: cs.name }));
        window.location.href = 'dashboard.html';
        return;
      }
    } catch(err) { /* lanjut ke error */ }

    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Masuk';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="page-title">Orders</div>
    <div class="flex gap-8 flex-wrap orders-filter-row">
      <select class="form-control" id="filterProduct" style="width:170px;" onchange="loadOrders(1)">
        <option value="">Semua Produk</option>
      </select>
      <select class="form-control" id="filterCS" style="width:150px;" onchange="loadOrders(1)">
        <option value="">Semua CS</option>
      </select>
      <select class="form-control" id="filterStatus" style="width:160px;" onchange="loadOrders(1)">
        <option value="">Semua Status</option>
        <option value="pending">Lead Baru</option>
        <option value="closing">Closing</option>
        <optgroup label="Belum Closing">
          <option value="pasif">· Pasif</option>
          <option value="ongkir">· Ongkir</option>
          <option value="harga">· Harga</option>
          <option value="ooc">· OOC</option>
          <option value="konsul">· Konsul</option>
          <option value="no_wa">· No. WA</option>
          <option value="blokir">· Blokir</option>
        </optgroup>
      </select>
      <input type="text" class="form-control" id="searchInput" placeholder="Cari nama customer..." style="width:220px;" oninput="filterOrders()">
      <button class="date-filter-btn" id="dateFilterBtn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="df-label">Last 30 Days</span> ▾</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap orders-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Produk</th>
            <th>CS Handle</th>
            <th>Waktu</th>
            <th>Status</th>
            <th>Keterangan</th>
            <th>Follow Up</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--gray-200);"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="detailModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <div class="modal-title">Detail Order</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Tutup</button>
      <button class="btn btn-accent" id="btnWA" onclick="openWA()">💬 Buka WA CS</button>
    </div>
  </div>
</div>

<!-- Closing Qty Modal -->
<div class="modal-overlay hidden" id="closingModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title">✅ Konfirmasi Closing</div>
      <button class="modal-close" onclick="closeClosingModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="closingCustomerInfo" style="background:var(--gray-50);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;"></div>
      <div id="closingTiersWrap"></div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <div class="form-group" style="margin-bottom:0;flex:1;">
          <label class="form-label">Qty <span class="req">*</span></label>
          <input type="number" class="form-control" id="closingQtyInput" min="1" placeholder="pcs..." oninput="onClosingQtyInput()" style="text-align:center;font-size:18px;font-weight:700;">
        </div>
        <div class="form-group" style="margin-bottom:0;flex:2;" id="closingManualPriceWrap">
          <label class="form-label">Harga Total (Rp) <span class="req">*</span></label>
          <input type="number" class="form-control" id="closingManualPrice" min="0" placeholder="Total harga..." oninput="onClosingManualPrice()" style="font-size:15px;font-weight:700;">
        </div>
      </div>
      <div id="closingValueDisplay" style="font-size:15px;font-weight:600;color:var(--gray-500);padding:10px 0 4px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeClosingModal()">Batal</button>
      <button class="btn btn-primary" id="btnConfirmClosing" onclick="confirmClosing()">Konfirmasi Closing</button>
    </div>
  </div>
</div>

<style>
  .tier-opt {
    padding:12px 16px; border:2px solid var(--gray-200); border-radius:var(--radius);
    background:var(--white); cursor:pointer; text-align:center; transition:all 0.15s;
    flex:1; min-width:100px;
  }
  .tier-opt:hover { border-color:var(--primary-light); }
  .tier-opt.selected { border-color:var(--primary); background:var(--primary-light,#EFF6FF); }
  .tier-opt .tier-qty { font-weight:700; font-size:17px; margin-bottom:2px; }
  .tier-opt .tier-ppu { font-size:11px; color:var(--gray-500); }
  .tier-opt .tier-total { font-size:13px; font-weight:700; color:var(--primary); margin-top:4px; }
</style>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/date-filter.js"></script>
<script>
  requireAuth();
  renderNavbar('orders');

  const API_URL = 'https://orderadsy.vercel.app/api';
  const PAGE_SIZE = 25;
  let allOrders = [];
  let currentOrder = null;
  let currentPage = 1;
  let totalCount = 0;
  let _dateFrom = null;
  let _dateTo   = null;
  let dateFilter;

  // Reload saat tab aktif kembali — cooldown 2 menit agar tidak reload terus-terusan
  let _lastLoadTime = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - _lastLoadTime > 120000) {
      loadOrders(currentPage);
    }
  });

  // Supabase Realtime — debounce 3 detik
  let _realtimeTimer = null;
  function scheduleReload(page = currentPage) {
    clearTimeout(_realtimeTimer);
    _realtimeTimer = setTimeout(() => {
      if (document.getElementById('detailModal').classList.contains('hidden')) {
        loadOrders(page);
      }
    }, 3000);
  }

  // Dengerin event dari navbar (1 channel cukup, tidak perlu channel sendiri)
  window.addEventListener('orderadsy:new-order', (e) => {
    const csId = getCSId();
    if (csId && e.detail?.cs_id !== csId) return;
    scheduleReload(1);
  });
  window.addEventListener('orderadsy:order-updated', () => scheduleReload(currentPage));

  window.addEventListener('DOMContentLoaded', async () => {
    dateFilter = new DateFilter(
      document.getElementById('dateFilterBtn'),
      ({ from, to }) => { _dateFrom = from; _dateTo = to; loadOrders(1); },
      'Semua'
    );

    // Load products untuk filter
    try {
      let q = '?select=id,name&order=name.asc';
      if (getCSId()) {
        const assigned = await sbGet('product_cs', `?cs_id=eq.${getCSId()}&select=product_id`);
        const ids = assigned.map(a => a.product_id).join(',');
        if (ids) q = `?id=in.(${ids})&select=id,name&order=name.asc`;
      }
      const products = await sbGet('products', q);
      const sel = document.getElementById('filterProduct');
      products.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    } catch(e) {}

    // Load CS untuk filter — hanya tampil ke admin
    const csFilterEl = document.getElementById('filterCS');
    if (getCSId()) {
      // CS login: sembunyikan filter CS (mereka sudah otomatis difilter)
      csFilterEl.closest('select') && (csFilterEl.style.display = 'none');
      csFilterEl.style.display = 'none';
    } else {
      try {
        const csList = await sbGet('cs_team', '?select=id,name&order=name.asc');
        csList.forEach(cs => {
          const opt = document.createElement('option');
          opt.value = cs.id;
          opt.textContent = cs.name;
          csFilterEl.appendChild(opt);
        });
      } catch(e) {}
    }

    // Auto-open order detail if navigated from notification
    const openId = new URLSearchParams(window.location.search).get('open');
    if (openId) {
      // Wait for orders to load, then open detail
      window._pendingOpenId = openId;
      // Clean URL
      history.replaceState({}, '', 'orders.html');
    }
  });

  async function loadOrders(page = 1) {
    currentPage = page;
    const status = document.getElementById('filterStatus').value;
    const search = document.getElementById('searchInput').value.trim();
    const offset = (page - 1) * PAGE_SIZE;

    const productId  = document.getElementById('filterProduct').value;
    const csIdFilter = getCSId() || document.getElementById('filterCS').value;

    const f = [];
    if (status)      f.push(`status=eq.${status}`);
    if (productId)   f.push(`product_id=eq.${productId}`);
    if (csIdFilter)  f.push(`cs_id=eq.${csIdFilter}`);
    if (search)      f.push(`customer_name=ilike.*${encodeURIComponent(search)}*`);
    if (_dateFrom)   f.push(`created_at=gte.${_dateFrom.toISOString()}`);
    if (_dateTo)     f.push(`created_at=lte.${_dateTo.toISOString()}`);

    const filterStr = f.length ? f.join('&') + '&' : '';
    const dataQ  = `?${filterStr}order=created_at.desc&limit=${PAGE_SIZE}&offset=${offset}&select=id,customer_name,customer_wa,customer_email,customer_address,customer_city,customer_note,customer_keluhan,status,created_at,fu_count,last_fu_at,closing_qty,closing_value,is_duplicate,product_id,cs_id,products(name,followup_welcome),cs_team(name,wa_number)`;

    try {
      // Hanya tampilkan "Loading..." kalau tabel masih kosong (pertama kali load)
      if (!allOrders.length) {
        document.getElementById('ordersTable').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--gray-400);">Loading...</td></tr>`;
      }
      const [orders, countRes] = await Promise.all([
        sbGet('orders', dataQ),
        fetch(`${SUPABASE_URL}/rest/v1/orders?${filterStr}select=id`, {
          headers: { ...getSupabaseHeaders(), 'Prefer': 'count=exact', 'Range': '0-0' },
        }),
      ]);
      allOrders = orders;
      const cr = countRes.headers.get('Content-Range');
      totalCount = parseInt(cr?.split('/')[1] || '0');
      _lastLoadTime = Date.now();
      renderOrders(orders);
      renderPagination();

      // Auto-open from notification link
      if (window._pendingOpenId) {
        const found = allOrders.find(o => o.id === window._pendingOpenId);
        if (found) {
          openDetail(window._pendingOpenId);
        } else {
          // Order not in current page (date filter hides it) — fetch it directly
          _fetchAndOpenOrder(window._pendingOpenId);
        }
        window._pendingOpenId = null;
      }
    } catch(e) {
      document.getElementById('ordersTable').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--red);">Gagal load: ${e.message}</td></tr>`;
    }
  }

  function filterOrders() {
    loadOrders(1);
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end   = Math.min(currentPage * PAGE_SIZE, totalCount);
    document.getElementById('pagination').innerHTML = `
      <div style="font-size:13px;color:var(--gray-400);">
        ${totalCount > 0 ? `${start}–${end} dari ${totalCount} order` : 'Tidak ada order'}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="loadOrders(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>← Prev</button>
        <span style="padding:4px 12px;font-size:13px;font-weight:600;">Hal. ${currentPage} / ${totalPages}</span>
        <button class="btn btn-outline btn-sm" onclick="loadOrders(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Next →</button>
      </div>`;
  }

  function renderOrders(orders) {
    const tbody = document.getElementById('ordersTable');
    if (!orders.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Tidak ada order</div></div></td></tr>`;
      return;
    }
    const statusMap = {
      pending: ['badge-orange', 'Lead Baru'],
      closing: ['badge-green',  'Closing'],
      pasif:   ['badge-gray',   'Pasif'],
      ongkir:  ['badge-purple', 'Ongkir'],
      harga:   ['badge-purple', 'Harga'],
      ooc:     ['badge-gray',   'OOC'],
      konsul:  ['badge-blue',   'Konsul'],
      no_wa:   ['badge-red',    'No. WA'],
      blokir:  ['badge-red',    'Blokir'],
    };
    tbody.innerHTML = orders.map(o => `
      <tr style="cursor:pointer;" onclick="openDetail('${o.id}')">
        <td>
          <div style="font-weight:600;font-size:14px;">${o.customer_name || '-'}${o.is_duplicate ? ' <span class="badge badge-red" style="font-size:10px;vertical-align:middle;">DUPLIKAT</span>' : ''}</div>
          <div style="font-size:12px;color:var(--gray-400);">💬 ${o.customer_wa || ''}</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px;">${o.products?.name || ''}</div>
        </td>
        <td data-label="Produk">${o.products?.name || '-'}</td>
        <td data-label="CS">${o.cs_team?.name || '-'}</td>
        <td data-label="Waktu" style="font-size:12px;color:var(--gray-400);">${timeAgo(o.created_at)}</td>
        <td data-label="Status" onclick="event.stopPropagation()">
          ${renderStatusCell(o.id, o.status)}
        </td>
        <td data-label="Keterangan" onclick="event.stopPropagation()">
          ${renderKetCell(o.id, o.status)}
        </td>
        <td data-label="Follow Up" onclick="event.stopPropagation()">
          ${renderFUBadge(o)}
        </td>
        <td data-label="" onclick="event.stopPropagation()">
          <button class="btn btn-outline btn-sm" onclick="openWADirect('${o.customer_wa}','${o.id}')">💬 WA</button>
        </td>
      </tr>`).join('');
  }

  const BELUM_CLOSING = new Set(['pasif','ongkir','harga','ooc','konsul','no_wa','blokir']);

  function renderFUBadge(o) {
    if (!o.fu_count) {
      return `<span class="badge badge-gray" style="font-size:11px;">Belum FU</span>`;
    }
    return `<div>
      <span class="badge badge-blue" style="font-size:11px;">FU ${o.fu_count}x</span>
      <div style="font-size:10px;color:var(--gray-400);margin-top:2px;">${timeAgo(o.last_fu_at)}</div>
    </div>`;
  }


  function renderStatusCell(id, status) {
    const isBelum = BELUM_CLOSING.has(status);
    const mainVal = isBelum ? '_belum' : status;
    return `<div id="status-cell-${id}">
      <select class="form-control" style="width:120px;padding:4px 8px;font-size:12px;" onchange="onMainStatus('${id}',this.value)">
        <option value="pending" ${mainVal==='pending'?'selected':''}>Lead Baru</option>
        <option value="closing" ${mainVal==='closing'?'selected':''}>Closing</option>
        <option value="_belum"  ${isBelum         ?'selected':''}>Belum Closing</option>
      </select>
    </div>`;
  }

  function renderKetCell(id, status, pending = false) {
    const isBelum = BELUM_CLOSING.has(status);
    if (!isBelum && !pending) {
      if (status === 'closing') {
        const o = allOrders.find(o => o.id === id);
        if (o && o.closing_qty) {
          return `<div id="ket-cell-${id}">
            <div style="font-size:13px;font-weight:700;color:var(--green);">${o.closing_qty} pcs</div>
            <div style="font-size:11px;color:var(--gray-500);">Rp ${Number(o.closing_value || 0).toLocaleString('id-ID')}</div>
          </div>`;
        }
      }
      return `<div id="ket-cell-${id}" style="color:var(--gray-300);font-size:13px;">—</div>`;
    }
    return `<div id="ket-cell-${id}">
      <select class="form-control" style="width:130px;padding:4px 8px;font-size:12px;" onchange="updateStatus('${id}',this.value)">
        ${pending ? `<option value="" disabled selected>Pilih Keterangan</option>` : ''}
        <option value="pasif"  ${status==='pasif' ?'selected':''}>Pasif</option>
        <option value="ongkir" ${status==='ongkir'?'selected':''}>Ongkir</option>
        <option value="harga"  ${status==='harga' ?'selected':''}>Harga</option>
        <option value="ooc"    ${status==='ooc'   ?'selected':''}>OOC</option>
        <option value="konsul" ${status==='konsul'?'selected':''}>Konsul</option>
        <option value="no_wa"  ${status==='no_wa' ?'selected':''}>No. WA</option>
        <option value="blokir" ${status==='blokir'?'selected':''}>Blokir</option>
      </select>
    </div>`;
  }

  function onMainStatus(id, val) {
    if (val === '_belum') {
      // Tampilkan sub-dropdown dengan "Pilih Keterangan", belum save ke DB
      const ketCell = document.getElementById('ket-cell-' + id);
      if (ketCell) ketCell.outerHTML = renderKetCell(id, '', true);
    } else if (val === 'closing') {
      openClosingModal(id);
    } else {
      updateStatus(id, val);
    }
  }

  async function updateStatus(id, status, closingQty = null, closingValue = null) {
    try {
      const patch = { status };
      if (status === 'closing' && closingQty) {
        patch.closing_qty   = closingQty;
        patch.closing_value = closingValue || 0;
      }
      await sbPatch('orders', `?id=eq.${id}`, patch);
      showToast('Status diperbarui', 'success');
      const o = allOrders.find(o => o.id === id);
      if (o) {
        o.status = status;
        if (closingQty) { o.closing_qty = closingQty; o.closing_value = closingValue; }
        // Re-render status + keterangan cell in place
        const cell = document.getElementById('status-cell-' + id);
        if (cell) cell.outerHTML = renderStatusCell(id, status);
        const ketCell = document.getElementById('ket-cell-' + id);
        if (ketCell) ketCell.outerHTML = renderKetCell(id, status);
      }

      // Kirim Purchase event saat status → closing
      const _o = allOrders.find(o => o.id === id);
      if (status === 'closing' && _o && _o.product_id) {
        const trackValue = closingValue || 0;
        try {
          const products = await sbGet('products', `?id=eq.${_o.product_id}&select=pixel_id,access_token,tiktok_pixel_id,tiktok_access_token,price,name`);
          const product = products[0];

          // Meta CAPI Purchase
          if (product && product.pixel_id && product.access_token) {
            fetch(`${API_URL}/send-capi`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                pixel_id:     product.pixel_id,
                access_token: product.access_token,
                event_name:   'Purchase',
                event_id:     'closing_meta_' + id,
                user_data: {
                  ph:      _o.customer_wa || '',
                  fn:      (_o.customer_name || '').split(' ')[0].toLowerCase(),
                  ln:      (_o.customer_name || '').split(' ').slice(1).join(' ').toLowerCase(),
                  ct:      (_o.customer_city || '').toLowerCase(),
                  country: 'id',
                },
                custom_data: {
                  product_name: product.name,
                  order_id:     id,
                  value:        trackValue || product.price || 0,
                  currency:     'IDR',
                },
              }),
            }).catch(e => console.warn('Meta CAPI Purchase gagal:', e.message));
          }

          // TikTok Events API Purchase
          if (product && product.tiktok_pixel_id && product.tiktok_access_token) {
            fetch(`${API_URL}/send-tiktok-event`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                pixel_code:   product.tiktok_pixel_id,
                access_token: product.tiktok_access_token,
                event_name:   'Purchase',
                event_id:     'closing_tt_' + id,
                user_data:    { ph: _o.customer_wa || '', em: _o.customer_email || null },
                custom_data:  { product_id: _o.product_id, product_name: product.name, value: trackValue || product.price || 0, currency: 'IDR', order_id: id },
              }),
            }).catch(e => console.warn('TikTok Events Purchase gagal:', e.message));
          }

        } catch(err) {
          console.warn('Purchase tracking gagal:', err.message);
        }
      }
    } catch(e) {
      showToast('Gagal update: ' + e.message, 'error');
    }
  }

  // Map field key → { label, value getter }
  const DETAIL_FIELD_MAP = {
    nama:    { label: 'Customer',           get: o => o.customer_name },
    wa:      { label: 'No. WhatsApp',       get: o => o.customer_wa },
    email:   { label: 'Email',              get: o => o.customer_email },
    alamat:  { label: 'Alamat',             get: o => o.customer_address },
    kota:    { label: 'Kota / Kecamatan',   get: o => o.customer_city },
    keluhan: { label: 'Keluhan',            get: o => o.customer_keluhan },
    catatan: { label: 'Catatan',            get: o => o.customer_note },
  };

  function _detailRow(label, value) {
    if (!value) return '';
    return `<div>
      <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">${label}</div>
      <div style="font-size:14px;">${value}</div>
    </div>`;
  }

  function openDetail(id) {
    currentOrder = allOrders.find(o => o.id === id);
    if (!currentOrder) return;
    const o = currentOrder;

    // Get enabled fields from checkout_pages.fields_config
    // Fallback: show all fields that have a value
    const fieldsConfig = o.checkout_pages?.fields_config || null;

    let fieldRows = '';
    if (fieldsConfig && Array.isArray(fieldsConfig)) {
      // Only render enabled fields, in order
      fieldsConfig.filter(f => f.enabled).forEach(f => {
        const def = DETAIL_FIELD_MAP[f.key];
        if (!def) return;
        const val = def.get(o);
        fieldRows += _detailRow(f.label || def.label, val);
      });
    } else {
      // Fallback: show all fields that have a value
      Object.entries(DETAIL_FIELD_MAP).forEach(([key, def]) => {
        const val = def.get(o);
        if (val) fieldRows += _detailRow(def.label, val);
      });
    }

    document.getElementById('modalBody').innerHTML = `
      <div style="display:grid;gap:14px;">
        ${fieldRows}
        <div style="display:flex;gap:12px;">
          <div style="flex:1;">
            <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">Produk</div>
            <div style="font-size:14px;">${o.products?.name || '-'}</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">CS Handle</div>
            <div style="font-size:14px;">${o.cs_team?.name || '-'}</div>
          </div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">Waktu Order</div>
          <div style="font-size:14px;">${new Date(o.created_at).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' })}</div>
        </div>
        ${o.closing_qty ? `<div style="background:var(--green-light,#F0FDF4);border:1px solid #86EFAC;border-radius:var(--radius-sm);padding:10px 14px;display:flex;gap:20px;">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">Closing Qty</div>
            <div style="font-size:15px;font-weight:700;color:var(--green);">${o.closing_qty} pcs</div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:2px;">Nilai Closing</div>
            <div style="font-size:15px;font-weight:700;color:var(--green);">Rp ${Number(o.closing_value || 0).toLocaleString('id-ID')}</div>
          </div>
        </div>` : ''}
      </div>`;
    document.getElementById('detailModal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

  function openWA() {
    if (!currentOrder) return;
    openWADirect(currentOrder.customer_wa, currentOrder.id);
  }

  function openWADirect(wa, orderId) {
    const n = normalizeWA(wa);
    if (!n || n === '62') { showToast('No. WhatsApp tidak tersedia', 'error'); return; }

    const o = allOrders.find(o => o.id === orderId);
    let msg = '';
    if (o) {
      const template = o.products?.followup_welcome ||
        'Halo Kak {{name}}, saya {{cs_name}}. Terima kasih sudah order ya kak!\n\nNama     : {{name}}\nNo. WA   : {{phone}}\nAlamat   : {{address}}\n\nSudah benar ya kak? 😊';
      msg = template
        .replace(/\{\{name\}\}/gi,    o.customer_name || '')
        .replace(/\{\{cs_name\}\}/gi, o.cs_team?.name || '')
        .replace(/\{\{phone\}\}/gi,   o.customer_wa || '')
        .replace(/\{\{address\}\}/gi, [o.customer_address, o.customer_city].filter(Boolean).join(', '))
        .replace(/\{\{product\}\}/gi, o.products?.name || '');
    }

    const url = `https://wa.me/${n}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
    window.open(url, '_blank');
  }

  async function _fetchAndOpenOrder(id) {
    try {
      const res = await sbGet('orders', `?id=eq.${id}&select=*,products(name,followup_welcome),cs_team(name,wa_number),checkout_pages(fields_config)&limit=1`);
      if (res && res[0]) {
        // Inject into allOrders temporarily so openDetail can find it
        if (!allOrders.find(o => o.id === id)) allOrders.unshift(res[0]);
        openDetail(id);
      }
    } catch(e) {}
  }

  // ── Closing Modal ──
  let _closingOrderId   = null;
  let _closingPrevStatus = 'pending';
  let _closingTiers     = [];
  let _closingBasePrice = 0;
  let _closingSelQty    = 0;
  let _closingSelValue  = 0;

  async function openClosingModal(orderId) {
    _closingOrderId  = orderId;
    _closingSelQty   = 0;
    _closingSelValue = 0;
    const o = allOrders.find(o => o.id === orderId);
    _closingPrevStatus = o?.status || 'pending';

    // Customer info
    document.getElementById('closingCustomerInfo').innerHTML = `
      <div style="font-size:13px;font-weight:700;">${o?.customer_name || '-'}</div>
      <div style="font-size:12px;color:var(--gray-500);margin-top:2px;">${o?.products?.name || ''}</div>`;

    // Reset fields
    document.getElementById('closingQtyInput').value = '';
    document.getElementById('closingValueDisplay').innerHTML = '';

    try {
      const products = await sbGet('products', `?id=eq.${o?.product_id}&select=name,price,price_tiers`);
      const p = products[0] || {};
      _closingTiers     = Array.isArray(p.price_tiers) ? p.price_tiers : [];
      _closingBasePrice = p.price || 0;
    } catch(e) {
      _closingTiers     = [];
      _closingBasePrice = 0;
    }

    // Render tiers
    const wrap = document.getElementById('closingTiersWrap');
    if (_closingTiers.length) {
      wrap.innerHTML = `
        <div style="font-size:12px;font-weight:600;color:var(--gray-400);text-transform:uppercase;margin-bottom:8px;">Pilih Paket</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${_closingTiers.map((t, i) => `
            <button class="tier-opt" id="tierOpt-${i}" onclick="selectClosingTier(${i})">
              <div class="tier-qty">${t.qty} pcs</div>
              <div class="tier-total">Rp ${Number(t.total).toLocaleString('id-ID')}</div>
              <div class="tier-ppu">Rp ${Math.round(t.total / t.qty).toLocaleString('id-ID')}/pcs</div>
            </button>`).join('')}
        </div>
        <div style="font-size:12px;color:var(--gray-400);margin:12px 0 0;text-align:center;">— atau ketik qty manual —</div>`;
    } else {
      wrap.innerHTML = '';
    }

    // Reset manual price
    document.getElementById('closingManualPrice').value = '';
    document.getElementById('closingManualPriceWrap').style.display = _closingTiers.length ? 'none' : '';

    document.getElementById('closingModal').classList.remove('hidden');
  }

  function selectClosingTier(i) {
    const t = _closingTiers[i];
    _closingSelQty   = t.qty;
    _closingSelValue = t.total;
    document.getElementById('closingQtyInput').value = t.qty;
    document.getElementById('closingManualPrice').value = '';
    document.getElementById('closingManualPriceWrap').style.display = 'none';
    document.getElementById('closingValueDisplay').innerHTML =
      `Total: <strong style="color:var(--primary);font-size:17px;">Rp ${_closingSelValue.toLocaleString('id-ID')}</strong>`;
    document.querySelectorAll('.tier-opt').forEach(b => b.classList.remove('selected'));
    const btn = document.getElementById('tierOpt-' + i);
    if (btn) btn.classList.add('selected');
  }

  function onClosingQtyInput() {
    const qty = parseInt(document.getElementById('closingQtyInput').value) || 0;
    _closingSelQty = qty;
    // De-select tier buttons
    document.querySelectorAll('.tier-opt').forEach(b => b.classList.remove('selected'));

    if (qty > 0) {
      // Tampilkan input harga manual (CS input sendiri)
      document.getElementById('closingManualPriceWrap').style.display = '';
      document.getElementById('closingManualPrice').value = '';
      _closingSelValue = 0;
      document.getElementById('closingValueDisplay').innerHTML = '';
    } else {
      document.getElementById('closingManualPriceWrap').style.display = _closingTiers.length ? 'none' : '';
      document.getElementById('closingValueDisplay').innerHTML = '';
    }
  }

  function onClosingManualPrice() {
    const total = parseInt(document.getElementById('closingManualPrice').value) || 0;
    _closingSelValue = total;
    if (total > 0) {
      document.getElementById('closingValueDisplay').innerHTML =
        `Total: <strong style="color:var(--primary);font-size:17px;">Rp ${total.toLocaleString('id-ID')}</strong>`;
    } else {
      document.getElementById('closingValueDisplay').innerHTML = '';
    }
  }

  function closeClosingModal() {
    document.getElementById('closingModal').classList.add('hidden');
    if (_closingOrderId) {
      const cell = document.getElementById('status-cell-' + _closingOrderId);
      if (cell) cell.outerHTML = renderStatusCell(_closingOrderId, _closingPrevStatus);
    }
    _closingOrderId = null;
  }

  async function confirmClosing() {
    if (!_closingSelQty || _closingSelQty <= 0) {
      showToast('Isi qty closing terlebih dahulu', 'error');
      return;
    }
    if (!_closingSelValue || _closingSelValue <= 0) {
      showToast('Isi harga total terlebih dahulu', 'error');
      return;
    }
    const id    = _closingOrderId;
    const qty   = _closingSelQty;
    const value = _closingSelValue;
    document.getElementById('closingModal').classList.add('hidden');
    _closingOrderId = null;
    await updateStatus(id, 'closing', qty, value);
  }

  // Initial load is triggered by DateFilter's default (Last 30 Days) callback
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Team — OrderAdsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .cs-card {
    background:var(--white); border:1px solid var(--gray-200);
    border-radius:var(--radius); padding:16px 20px;
    display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow-sm); transition:box-shadow 0.15s;
  }
  .cs-card:hover { box-shadow:var(--shadow-md); }
  .cs-avatar-lg {
    width:48px; height:48px; border-radius:50%;
    background:var(--primary-light); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; flex-shrink:0;
  }
  .cs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div id="toast"></div>

<div class="page-content">
  <div class="page-header">
    <div class="page-title">👥 CS Team</div>
    <button class="btn btn-primary" onclick="openAddModal()">＋ Tambah CS</button>
  </div>

  <div class="cs-grid" id="csGrid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400);">Loading...</div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay hidden" id="csModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Tambah CS Baru</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label class="form-label">Nama CS <span class="req">*</span></label>
        <input type="text" class="form-control" id="csName" placeholder="Contoh: Siti Nurhaliza">
      </div>
      <div class="form-group">
        <label class="form-label">No. WhatsApp <span class="req">*</span></label>
        <input type="text" class="form-control" id="csWA" placeholder="08xxxxxxxxxx">
        <div class="form-hint">Format: 08xx atau 628xx</div>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="req">*</span></label>
        <input type="email" class="form-control" id="csEmail" placeholder="cs@adsy.id">
        <div class="form-hint">Dipakai untuk login CS & notifikasi order masuk</div>
      </div>
      <div class="form-group">
        <label class="form-label">Password Login CS <span class="req">*</span></label>
        <input type="password" class="form-control" id="csPassword" placeholder="Password untuk CS login">
        <div class="form-hint">CS akan pakai email + password ini untuk masuk dashboard</div>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <div class="toggle-wrap">
          <button class="toggle on" id="csStatusToggle" onclick="toggleStatus()"></button>
          <span id="csStatusLabel">Active</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveCS()">Simpan</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script>
  requireAuth();
  renderNavbar('others');

  let csList = [];
  let editingId = null;
  let csActive = true;

  async function loadCS() {
    try {
      csList = await sbGet('cs_team', '?order=created_at.asc');
      renderCS();
    } catch(e) {
      document.getElementById('csGrid').innerHTML = `<div style="color:var(--red);">Gagal load: ${e.message}</div>`;
    }
  }

  function renderCS() {
    const grid = document.getElementById('csGrid');
    if (!csList.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;"><div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-text">Belum ada CS. Tambah CS pertama kamu!</div></div></div>`;
      return;
    }
    grid.innerHTML = csList.map(cs => `
      <div class="cs-card">
        <div class="cs-avatar-lg">${cs.name[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:15px;">${cs.name}</div>
          <div style="font-size:12px;color:var(--gray-400);">💬 ${cs.wa_number}</div>
          ${cs.email ? `<div style="font-size:12px;color:var(--gray-400);">📧 ${cs.email}</div>` : ''}
          <span class="badge ${cs.is_active?'badge-green':'badge-gray'}" style="margin-top:4px;">${cs.is_active?'Active':'Inactive'}</span>
        </div>
        <div class="flex gap-8" style="flex-direction:column;align-items:flex-end;">
          <button class="btn btn-outline btn-sm" onclick="openEditModal('${cs.id}')">Edit</button>
          <button class="btn btn-sm" style="background:var(--red-light);color:var(--red);border:none;" onclick="deleteCS('${cs.id}','${cs.name.replace(/'/g,"\\'")}')">Hapus</button>
        </div>
      </div>`).join('');
  }

  function openAddModal() {
    editingId = null;
    csActive = true;
    document.getElementById('modalTitle').textContent = 'Tambah CS Baru';
    document.getElementById('editId').value = '';
    document.getElementById('csName').value = '';
    document.getElementById('csWA').value = '';
    document.getElementById('csEmail').value = '';
    document.getElementById('csPassword').value = '';
    setStatusUI(true);
    document.getElementById('csModal').classList.remove('hidden');
  }

  function openEditModal(id) {
    const cs = csList.find(c => c.id === id);
    if (!cs) return;
    editingId = id;
    csActive = cs.is_active;
    document.getElementById('modalTitle').textContent = 'Edit CS';
    document.getElementById('editId').value = id;
    document.getElementById('csName').value = cs.name;
    document.getElementById('csWA').value = cs.wa_number;
    document.getElementById('csEmail').value = cs.email || '';
    document.getElementById('csPassword').value = cs.password || '';
    setStatusUI(cs.is_active);
    document.getElementById('csModal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('csModal').classList.add('hidden'); }

  function toggleStatus() {
    csActive = !csActive;
    setStatusUI(csActive);
  }

  function setStatusUI(active) {
    csActive = active;
    const t = document.getElementById('csStatusToggle');
    t.className = 'toggle ' + (active ? 'on' : '');
    document.getElementById('csStatusLabel').textContent = active ? 'Active' : 'Inactive';
  }

  async function saveCS() {
    const name     = document.getElementById('csName').value.trim();
    const wa       = document.getElementById('csWA').value.trim();
    const email    = document.getElementById('csEmail').value.trim();
    const password = document.getElementById('csPassword').value.trim();

    if (!name)     { showToast('Nama CS wajib diisi', 'error'); return; }
    if (!wa)       { showToast('No. WhatsApp wajib diisi', 'error'); return; }
    if (!email)    { showToast('Email wajib diisi', 'error'); return; }
    if (!password) { showToast('Password wajib diisi', 'error'); return; }

    const waFormatted = normalizeWA(wa);
    const payload = { name, wa_number: waFormatted, email, password, is_active: csActive };

    try {
      if (editingId) {
        await sbPatch('cs_team', `?id=eq.${editingId}`, payload);
        showToast('CS diperbarui', 'success');
      } else {
        await sbPost('cs_team', payload);
        showToast('CS berhasil ditambahkan', 'success');
      }
      closeModal();
      loadCS();
    } catch(e) {
      showToast('Gagal simpan: ' + e.message, 'error');
    }
  }

  async function deleteCS(id, name) {
    if (!confirm(`Hapus CS "${name}"? CS akan dihapus dari semua produk yang diassign.`)) return;
    try {
      await sbDelete('cs_team', `?id=eq.${id}`);
      showToast('CS dihapus', 'success');
      loadCS();
    } catch(e) {
      showToast('Gagal hapus: ' + e.message, 'error');
    }
  }

  loadCS();
</script>
</body>
</html>
